[package]
name = "fcc-uls-aircraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Weekly FCC ULS Part 87 Active aircraft radio licenses in SQLite"
license = "MIT"
repository = "https://github.com/alexwoolford/fcc-uls-aircraft"

[[bin]]
name = "fcc-uls-aircraft"
path = "src/main.rs"

[lib]
name = "fcc_uls_aircraft"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
capturable-state = { git = "https://github.com/alexwoolford/capturable-state", tag = "v0.1.1" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
